name: Capture Evidence Acceptance
on:
  push:
    paths:
      - 'aftertone/capture.py'
      - 'aftertone/evidence.py'
      - '.github/workflows/capture-acceptance.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: aftertone-live-research
          run-id: 39448375669
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts
      - run: python -m aftertone.capture --root artifacts/eight-round --limit 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aftertone-capture-acceptance
          path: artifacts/eight-round/**/*.json
