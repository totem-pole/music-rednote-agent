name: Live Integration Research
on:
  push:
    paths:
      - 'scripts/live_integration.py'
      - '.github/workflows/live-research.yml'
  workflow_dispatch:
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/live_integration.py
      - run: python scripts/live_articles.py
      - run: python -m scripts.live_editorial
      - run: python scripts/full_source_sweep.py
      - name: Execute search protocol with available metadata providers
        run: python -m aftertone.full_research --mode metadata --output artifacts/eight-round
      - name: Upload real HTTP audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aftertone-live-research
          path: |
            artifacts/integration/*.json
            artifacts/full-sweep/*.json
            artifacts/eight-round/**/*.json
