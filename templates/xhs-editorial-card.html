<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AFTERTONE · Editorial Card</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#ddd;font-family:"Noto Sans CJK SC","Microsoft Yahei",sans-serif}
.page{width:1080px;height:1440px;padding:95px 90px;background:#f4f0e9;color:#232422;display:flex;flex-direction:column;overflow:hidden;position:relative}
.meta{display:flex;justify-content:space-between;font-size:28px;letter-spacing:.07em;color:#76776f;border-bottom:2px solid #b6b5ad;padding-bottom:28px}
.kicker{font-size:33px;margin-top:115px;color:#62645a}.headline{font-family:"Noto Serif CJK SC","SimSun",serif;font-weight:600;font-size:80px;line-height:1.29;margin:35px 0 60px;overflow-wrap:anywhere}
.body{font-size:44px;line-height:1.65;letter-spacing:.02em;white-space:pre-line;overflow-wrap:anywhere;flex:1}
.footer{font-size:29px;color:#73746e;border-top:2px solid #b6b5ad;padding-top:24px;display:flex;justify-content:space-between}
@media(max-width:1080px){body{overflow:auto}} 
</style></head><body>
<section class="page">
<div class="meta"><span>AFTERTONE / RECORD NOTES</span><span>{{NUMBER}}</span></div>
<div class="kicker">{{KICKER}}</div>
<div class="headline">{{HEADLINE}}</div>
<div class="body">{{BODY}}</div>
<div class="footer"><span>{{ALBUM}}</span><span>{{DATE}}</span></div>
</section>
</body></html>
